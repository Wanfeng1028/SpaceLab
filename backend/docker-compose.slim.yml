# SpaceLab Slim 单容器部署方案
# 使用 SQLite + 内存缓存，无需独立 PostgreSQL / Redis
# 适用于 2C2G 低资源环境
#
# 用法：docker compose -f docker-compose.slim.yml up -d

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacelab-slim
    environment:
      # 数据库：使用 SQLite
      DB_DRIVER: sqlite
      DATABASE_URL: /app/data/spacelab.db
      # 缓存：使用内存（无 Redis）
      CACHE_DRIVER: memory
      # JWT 密钥（生产环境务必修改）
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRATION: 24h
      JWT_REFRESH_EXPIRATION: 168h
      # 服务器配置
      SERVER_PORT: 8080
      ENVIRONMENT: production
      MAX_UPLOAD_SIZE: 10485760
      UPLOAD_PATH: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
      # 可选功能开关（2C2G 建议关闭不需要的功能）
      ENABLE_PROMETHEUS: "false"
      ENABLE_WEBSOCKET: "false"
      ENABLE_CRON: "true"
      # Turnstile（可选）
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    ports:
      - "8081:8080"
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads:
