jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ Git LFS 已停用（2026-08-09）—— 保留原始步骤供后续恢复
      #
      # - uses: actions/checkout@v4
      #   with:
      #     lfs: false
      #
      # - name: Cache Git LFS objects
      #   uses: actions/cache@v4
      #   with:
      #     path: .git/lfs
      #     key: lfs-${{ runner.os }}-${{ hashFiles('.gitattributes', 'public/**/*.mp4', 'public/**/*.mp3', 'public/**/*.mov', 'public/**/*.webm') }}
      #     restore-keys: |
      #       lfs-${{ runner.os }}-
      #
      # - name: Pull Git LFS objects
      #   run: git lfs pull

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/build-content.mjs
      - run: npm run build -- --base-href=/SpaceLab/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare for GitHub Pages
        working-directory: dist/spacelab/browser
        run: |
          touch .nojekyll
          cp index.html 404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/spacelab/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
